[project]
name = "gem-intelligence-scraper"
version = "1.0.0"
description = "Daily collector for publicly accessible GeM listing data"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"scraper/tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scraper"]
exclude = ["scraper/tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["scraper/tests"]
addopts = "-ra"
